<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc">
<title id="title">Signal: extend the data platform, activate its intelligence</title><desc id="desc">Databricks Delta and Cosmos data enter Fabric through different Bronze mechanisms. Existing Fabric Silver, Gold and Warehouse serve a read-only Rayfin app. Investigations persist in a separate app-owned SQL store.</desc>

version: 2
updates:
  - package-ecosystem: npm
    directory: /fabric-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rayfin-sdk:
        patterns: ['@microsoft/rayfin-*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
